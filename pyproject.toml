[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pybeams"
version = "0.1.0"
description = "Axisymmetric scalar beam propagation and ideal optical elements using pyhank"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pyhank>=2.4",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = [
    "matplotlib>=3.6",
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pybeams = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
